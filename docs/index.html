<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>环评合规预审</title>
  <style>
    :root { --paper:#efe6d4; --ink:#1b2620; --green:#1b5a42; --seal:#8d3c2e; --card:#fffaf1; --line:#d9cdb6; }
    * { box-sizing: border-box; }
    body { margin:0; background: radial-gradient(circle at top, #f7f1e4, var(--paper) 42%); color:var(--ink); font:17px/1.65 "Palatino Linotype","Songti SC","SimSun",serif; }
    main { width:min(820px, calc(100% - 36px)); margin:0 auto; padding:36px 0 64px; }
    .seal { display:inline-block; border:1px solid var(--seal); color:var(--seal); padding:2px 8px; letter-spacing:.2em; font-size:13px; }
    h1 { font-size:40px; font-weight:600; line-height:1.25; margin:14px 0 8px; }
    .note { background:var(--seal); color:#fff8f3; padding:12px 14px; border-radius:10px; font-family:"Segoe UI","Microsoft YaHei",sans-serif; font-size:15px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; margin-top:18px; }
    a.button, span.button { display:inline-block; background:var(--green); color:white; text-decoration:none; padding:12px 18px; border-radius:999px; font-family:"Segoe UI","Microsoft YaHei",sans-serif; }
    .small { color:#4d5a53; font-family:"Segoe UI","Microsoft YaHei",sans-serif; font-size:14px; }
  </style>
</head>
<body>
  <main>
    <div class="seal">示意</div>
    <h1>环评合规预审</h1>
    <p class="note">辅助预审，不构成法律意见。报告留在你的电脑上，这个网页不接收文件。</p>
    <div class="card">
      <p><a class="button" id="localRun" href="elaw://launch">本地运行</a></p>
      <p id="notWindows" class="small" hidden>暂仅支持 Windows。</p>
      <p class="small">点下去之后，浏览器会问要不要打开 elaw。这是系统提示，选打开即可，也可以勾选始终允许。</p>
      <p class="small">没反应？<a href="https://github.com/renjianfj163/elaw/releases/latest/download/hospital-eia-windows.zip">下载安装包</a>。安装包已自带 Python，解压后不用再装。装好后也可以从桌面的「环评合规预审」打开。</p>
      <p class="small">直接上传旧版 Word（.doc）需要本机另装 LibreOffice。用 Word 或 WPS 另存为 .docx 再上传则不用。模型密钥在本机工作台里自己填写，不会做进安装包。没有打开外发时，程序不会把报告片段送去接口。</p>
    </div>
  </main>
  <script>
    (function () {
      var windows = /Windows/i.test(navigator.userAgent || "");
      if (!windows) {
        var button = document.getElementById("localRun");
        var note = document.getElementById("notWindows");
        if (button) button.hidden = true;
        if (note) note.hidden = false;
      }
    })();
  </script>
</body>
</html>
