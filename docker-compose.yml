services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: elaw
      POSTGRES_PASSWORD: elaw
      POSTGRES_DB: elaw
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elaw -d elaw"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://elaw:elaw@db:5432/elaw
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ELAW_CONFIG_DIR: /config
      DATA_DIR: /data
      ELAW_GUARD: "0"
    volumes:
      - ./config:/config:ro
      - elawdata:/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  elawdata:
